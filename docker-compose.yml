services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelforge
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: pixelforge
    ports:
      - "5432:5432"
    volumes:
      - pixelforge-pgdata:/var/lib/postgresql/data

volumes:
  pixelforge-pgdata:
